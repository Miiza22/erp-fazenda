      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url("https://i.imgur.com/zYIlgBl.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: 65%;
        content: "";

      }

      header {
        background: linear-gradient(90deg, #111827, #1f2937);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);

        font-size: 34px;
        font-weight: bold;
        padding: 20px;
        text-align: center;
      }

      .logo-titulo {

      }

        max-width: 1700px;

          <input type="number" id="preco" placeholder="Preço venda" class="campo-preco" step="0.01" />
          <input type="number" id="estoque" placeholder="Qtd" class="campo-estoque" min="0" />
          <input type="date" id="validade" />
          <input type="file" id="imagemManual" accept="image/*" capture="environment" />
        </div>

          <button class="btn-ia" onclick="buscarProdutoOnline()">Cadastro Inteligente IA</button>

        <div class="filtro-box">

              <option value="30dias">Vencem em até 30 dias</option>
              <option value="sem-validade">Sem validade</option>
            </select>

        </div>

        <div class="flex">

          <button class="btn-atualizar" onclick="atualizarSistema()">Atualizar sistema</button>
        </div>

      function normalizarProduto(produto) {
        return {
          ...produto,
          codigoBarras: produto.codigoBarras ?? produto.codigo_barras ?? "",
        };
      }

      function escaparHtml(valor) {
        return String(valor ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escaparJs(valor) {
        return String(valor ?? "").replaceAll("\\", "\\\\").replaceAll("'", "\\'");
      }

      function numero(valor) {
        return Number.parseFloat(valor || 0) || 0;
      }

      function inteiro(valor) {
        return Number.parseInt(valor || 0, 10) || 0;
      }

      function valorTimestamp(validade) {
        if (!validade) return Infinity;
        const timestamp = new Date(validade).getTime();
        return Number.isNaN(timestamp) ? Infinity : timestamp;
      }

      function diasParaVencer(validade) {
        const timestamp = valorTimestamp(validade);
        if (!Number.isFinite(timestamp)) return Infinity;
        const hoje = new Date();
        return Math.ceil((timestamp - hoje) / (1000 * 60 * 60 * 24));
      }

      function calcularLucro(custo, preco) {
        const custoNumero = numero(custo);
        const precoNumero = numero(preco);
        if (custoNumero <= 0) return "0.0";
        return (((precoNumero - custoNumero) / custoNumero) * 100).toFixed(1);
      }

      function salvarProdutoNoBancoLocal(produto) {
        if (!produto.codigoBarras) return;

        bancoProdutos[produto.codigoBarras] = {
          nome: produto.nome || "",
          marca: produto.marca || "",
          categoria: produto.categoria || "alimenticio",
        };

        localStorage.setItem("bancoProdutos", JSON.stringify(bancoProdutos));
      }

      function inferirCategoriaProduto(texto, categoriaPadrao = "alimenticio") {
        const conteudo = String(texto || "").toLowerCase();

        const regras = [
          { categoria: "bebidas", termos: ["bebida", "refrigerante", "refri", "suco", "nectar", "água", "agua", "cerveja", "vinho", "tônica", "tonica", "energético", "energetico"] },
          { categoria: "limpeza", termos: ["amaciante", "detergente", "lava", "louça", "loucas", "limpeza", "desinfetante", "sabão", "sabao", "saboneteira", "alvejante", "água sanitária", "agua sanitaria", "multiuso", "roupa"] },
          { categoria: "alimenticio", termos: ["azeitona", "vinagre", "molho", "barbecue", "fermento", "cobertura", "sorvete", "tempero", "condimento", "maionese", "ketchup", "mostarda", "arroz", "feijão", "feijao", "macarrão", "macarrao", "farinha", "açúcar", "acucar", "café", "cafe"] },
          { categoria: "higiene", termos: ["higiene", "sabonete", "shampoo", "condicionador", "creme dental", "desodorante", "absorvente", "fralda", "papel higiênico", "papel higienico"] },
          { categoria: "resfriados", termos: ["iogurte", "queijo", "manteiga", "margarina", "refrigerado", "resfriado", "frios", "presunto", "mortadela", "requeijão", "requeijao"] },
          { categoria: "bazar", termos: ["bazar", "utilidade", "utensílio", "utensilio", "plástico", "plastico", "copo descartável", "copo descartavel", "papel alumínio", "papel aluminio"] },
        ];

        const regra = regras.find((item) => item.termos.some((termo) => conteudo.includes(termo)));
        return regra?.categoria || categoriaPadrao;
      }

      function limparTextoProduto(valor) {
        return String(valor || "").replace(/\s+/g, " ").trim();
      }

      function normalizarProdutoOpenFacts(dados, fonte, categoriaPadrao) {
        if (!dados || dados.status !== 1 || !dados.product) return null;

        const produto = dados.product;
        const nome = limparTextoProduto(
          produto.product_name_pt ||
            produto.product_name_br ||
            produto.product_name ||
            produto.generic_name_pt ||
            produto.generic_name,
        );

        if (!nome) return null;

        const marca = limparTextoProduto(produto.brands || produto.brands_tags?.[0]);
        const textoCategoria = [
          produto.categories,
          produto.categories_hierarchy?.join(" "),
          produto.labels,
          nome,
        ].join(" ");

        return {
          nome,
          marca,
          categoria: inferirCategoriaProduto(textoCategoria, categoriaPadrao),
          imagem: produto.image_front_url || produto.image_url || "",
          fonte,
        };
      }

      function normalizarProdutoUpcItemDb(dados) {
        const item = dados?.items?.[0];
        if (!item?.title) return null;

        const nome = limparTextoProduto(item.title);

        return {
          nome,
          marca: limparTextoProduto(item.brand),
          categoria: inferirCategoriaProduto(`${item.category || ""} ${nome}`, "alimenticio"),
          imagem: item.images?.[0] || "",
          fonte: "UPC Item DB",
        };
      }

      function normalizarProdutoBarcodeMonster(dados) {
        const nome = limparTextoProduto(dados?.description || dados?.title || dados?.name);

        if (!nome) return null;

        return {
          nome,
          marca: limparTextoProduto(dados.brand || dados.company),
          categoria: inferirCategoriaProduto(`${dados.category || ""} ${nome}`, "alimenticio"),
          imagem: dados.image || "",
          fonte: "Barcode Monster",
        };
      }

      function decodificarEntidadesHtml(valor) {
        const textarea = document.createElement("textarea");
        textarea.innerHTML = valor || "";
        return textarea.value;
      }

      function normalizarProdutoCosmosHtml(html) {
        if (!html) return null;

        const titulo =
          html.match(/<span id=['"]product_description['"]>(.*?)<\/span>/i)?.[1] ||
          html.match(/<meta content=['"]([^'"]+)['"] property=['"]og:title['"]>/i)?.[1] ||
          html.match(/<title>(.*?)<\/title>/i)?.[1];

        let nome = limparTextoProduto(decodificarEntidadesHtml(titulo || ""));
        nome = nome
          .replace(/\s+-\s+GTIN\/EAN.*$/i, "")
          .replace(/\s+-\s+Cosmos$/i, "")
          .replace(/^\d{8,14}\s+-\s+/i, "");

        if (!nome || /resultados da busca|nenhum resultado|cosmos$/i.test(nome)) return null;

        const marca = limparTextoProduto(
          decodificarEntidadesHtml(html.match(/<span class=['"]brand-name['"]>\s*([^<]+)\s*<\/span>/i)?.[1] || ""),
        );

        return {
          nome,
          marca: marca && !/não informado/i.test(marca) ? marca : "",
          categoria: inferirCategoriaProduto(nome, "alimenticio"),
          imagem: "",
          fonte: "Cosmos",
        };
      }

      function buscarProdutoPorFamilia(codigo) {
        const familia = familiasCodigoBarras.find((item) => codigo.startsWith(item.prefixo));

        if (!familia) return null;

        return {
          ...familia,
          fonte: "Família de código de barras",
        };
      }

      function buscarProdutoJaCarregado(codigo) {
        const produto = produtos.find((item) => String(item.codigoBarras) === String(codigo));

        if (!produto) return null;

        return {
          nome: produto.nome || "",
          marca: produto.marca || "",
          categoria: produto.categoria || "alimenticio",
          imagem: produto.imagem || "",
          fonte: "Produtos cadastrados",
        };
      }

      function chaveLote(codigoBarras, validade) {
        return `${codigoBarras || "sem-codigo"}|${validade || "sem-validade"}`;
      }

      function mesmoLote(produto, codigoBarras, validade) {
        return (
          codigoBarras &&
          String(produto.codigoBarras || "") === String(codigoBarras) &&
          String(produto.validade || "") === String(validade || "")
        );
      }

      async function buscarJson(url) {
        const resposta = await fetch(url, {
          headers: {
            Accept: "application/json",
          },
        });

        if (!resposta.ok) {
          throw new Error(`HTTP ${resposta.status}`);
        }

        return resposta.json();
      }

      async function buscarTexto(url) {
        const resposta = await fetch(url, {
          headers: {
            Accept: "text/html,application/xhtml+xml",
          },
        });

        if (!resposta.ok) {
          throw new Error(`HTTP ${resposta.status}`);
        }

        return resposta.text();
      }

      async function buscarProdutoEmFontes(codigo) {
        const fontes = [
          {
            nome: "Open Food Facts Brasil",
            url: `https://br.openfoodfacts.org/api/v2/product/${codigo}.json`,
            normalizar: (dados) => normalizarProdutoOpenFacts(dados, "Open Food Facts Brasil", "alimenticio"),
          },
          {
            nome: "Open Food Facts Mundial",
            url: `https://world.openfoodfacts.org/api/v2/product/${codigo}.json`,
            normalizar: (dados) => normalizarProdutoOpenFacts(dados, "Open Food Facts Mundial", "alimenticio"),
          },
          {
            nome: "Open Beauty Facts",
            url: `https://world.openbeautyfacts.org/api/v2/product/${codigo}.json`,
            normalizar: (dados) => normalizarProdutoOpenFacts(dados, "Open Beauty Facts", "higiene"),
          },
          {
            nome: "Open Products Facts",
            url: `https://world.openproductsfacts.org/api/v2/product/${codigo}.json`,
            normalizar: (dados) => normalizarProdutoOpenFacts(dados, "Open Products Facts", "limpeza"),
          },
          {
            nome: "UPC Item DB",
            url: `https://api.upcitemdb.com/prod/trial/lookup?upc=${codigo}`,
            normalizar: normalizarProdutoUpcItemDb,
          },
          {
            nome: "Barcode Monster",
            url: `https://barcode.monster/api/${codigo}`,
            normalizar: normalizarProdutoBarcodeMonster,
          },
          {
            nome: "Open Pet Food Facts",
            url: `https://world.openpetfoodfacts.org/api/v2/product/${codigo}.json`,
            normalizar: (dados) => normalizarProdutoOpenFacts(dados, "Open Pet Food Facts", "alimenticio"),
          },
          {
            nome: "Cosmos",
            url: `https://api.allorigins.win/raw?url=${encodeURIComponent(
              `https://api.cosmos.bluesoft.com.br/pesquisar?q=${codigo}`,
            )}`,
            tipo: "texto",
            normalizar: normalizarProdutoCosmosHtml,
          },
        ];

        for (const fonte of fontes) {
          try {
            const dados = fonte.tipo === "texto" ? await buscarTexto(fonte.url) : await buscarJson(fonte.url);
            const produto = fonte.normalizar(dados);

            if (produto?.nome) {
              return produto;
            }
          } catch (erro) {
            console.warn(`Busca falhou em ${fonte.nome}:`, erro);
          }
        }

        return buscarProdutoPorFamilia(codigo);
      }

      function preencherProdutoEncontrado(produto) {
        document.getElementById("nome").value = produto.nome || "";
        document.getElementById("marcaCadastro").value = produto.marca || "";
        document.getElementById("categoriaCadastro").value = produto.categoria || "alimenticio";
        document.getElementById("estoque").value = document.getElementById("estoque").value || 1;
        document.getElementById("custo").value ||= 0;
        document.getElementById("preco").value ||= 0;
      }

      function converterImagemBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function tamanhoTextoBanco(valor) {
        const texto = String(valor || "");
        if (!texto) return 0;

        if (window.TextEncoder) {
          return new TextEncoder().encode(texto).length;
        }

        return texto.length;
      }

      function tamanhoImagemSalva(imagem) {
        return tamanhoTextoBanco(imagem);
      }

      function tamanhoImagensBancoAtual(idIgnorado = null) {
        return produtos.reduce((total, produto) => {
          if (idIgnorado !== null && String(produto.id) === String(idIgnorado)) return total;
          return total + tamanhoImagemSalva(produto.imagem);
        }, 0);
      }

      function estimarTamanhoBase64Arquivo(arquivo) {
        return Math.ceil((arquivo.size || 0) * 1.37) + 120;
      }

      function formatarMegabytes(bytes) {
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      function validarEspacoParaImagem(arquivo, idProduto = null) {
        if (!arquivo) return true;

        const produtoAtual = produtos.find((produto) => String(produto.id) === String(idProduto));
        const usoAtual = tamanhoImagensBancoAtual(idProduto);
        const tamanhoAtualProduto = idProduto ? tamanhoImagemSalva(produtoAtual?.imagem) : 0;
        const tamanhoNovaImagem = estimarTamanhoBase64Arquivo(arquivo);
        const usoEstimado = usoAtual + tamanhoNovaImagem;
        const percentualEstimado = usoEstimado / LIMITE_ESTIMADO_BANCO_BYTES;

        if (percentualEstimado >= PERCENTUAL_BLOQUEIO_BANCO) {
          alert(
            `Imagem não salva.\n\nO banco ficaria perto do limite de ${formatarMegabytes(LIMITE_ESTIMADO_BANCO_BYTES)}.\nUso estimado após salvar: ${formatarMegabytes(usoEstimado)}.\n\nUse uma foto menor ou apague imagens antigas antes de tentar novamente.`,
          );
          return false;
        }

        if (percentualEstimado >= PERCENTUAL_AVISO_BANCO) {
          return confirm(
            `Atenção: o banco está ficando cheio.\n\nUso estimado após salvar esta imagem: ${formatarMegabytes(usoEstimado)} de ${formatarMegabytes(LIMITE_ESTIMADO_BANCO_BYTES)}.\nImagem anterior deste produto: ${formatarMegabytes(tamanhoAtualProduto)}.\n\nDeseja salvar mesmo assim?`,
          );
        }

        return true;
      }

      function filtrarCategoria() {
        filtroAtual = document.getElementById("filtroCategoria").value;
        atualizarTabela();
      }

      function filtrarValidade() {
        filtroValidadeAtual = document.getElementById("filtroValidade").value;
        atualizarTabela();
      }

      function produtoPassaFiltroValidade(produto) {
        const dias = diasParaVencer(produto.validade);

        if (filtroValidadeAtual === "vencidos") return Number.isFinite(dias) && dias < 0;
        if (filtroValidadeAtual === "7dias") return Number.isFinite(dias) && dias >= 0 && dias <= 7;
        if (filtroValidadeAtual === "30dias") return Number.isFinite(dias) && dias >= 0 && dias <= 30;
        if (filtroValidadeAtual === "sem-validade") return !produto.validade;

        return true;
      }

      function ordenarPorValidade() {
        produtos.sort((a, b) => valorTimestamp(a.validade) - valorTimestamp(b.validade));
        atualizarTabela();
      }

      function limparCampos() {
        document.getElementById("codigoBarras").value = "";
        document.getElementById("nome").value = "";
        document.getElementById("marcaCadastro").value = "";
        document.getElementById("custo").value = "";

      async function abrirCamera() {
        if (cameraAtiva) return;

        cameraAtiva = true;
        const reader = document.getElementById("reader");
        reader.innerHTML = "<p style='padding:12px;color:#4b5563;'>Abrindo câmera...</p>";

        try {
          if (!window.isSecureContext) {
            throw new Error("A câmera só funciona em HTTPS ou localhost.");
          }

          if (!window.Html5Qrcode) {
            throw new Error("Leitor de código de barras não carregou. Verifique a internet e recarregue a página.");
          }

          const configuracao = {
            fps: 10,
            qrbox: { width: 260, height: 180 },
            aspectRatio: 1.7,
            disableFlip: false,
          };

          const cameras = await Html5Qrcode.getCameras();

          if (!cameras.length) {
            throw new Error("Nenhuma câmera foi encontrada neste dispositivo.");
          }

          const cameraPreferida =
            cameras.find((camera) => /back|rear|environment|traseira|0/i.test(camera.label)) || cameras[0];

          leitorCamera = new Html5Qrcode("reader");

          const aoLerCodigo = (decodedText) => {
            if (leituraCameraEmProcessamento) return;
            if (decodedText === ultimaLeitura) return;

            leituraCameraEmProcessamento = true;
            ultimaLeitura = decodedText;
            navigator.vibrate?.(200);
            document.getElementById("codigoBarras").value = decodedText;

            setTimeout(async () => {
              try {
                if (leitorCamera?.isScanning) {
                  await leitorCamera.stop();
                }
              } catch (erroParada) {
                console.warn("Não foi possível parar a câmera:", erroParada);
              }

              try {
                await leitorCamera?.clear();
              } catch (erroLimpeza) {
                console.warn("Não foi possível limpar o leitor:", erroLimpeza);
              }

              cameraAtiva = false;
              leitorCamera = null;
              leituraCameraEmProcessamento = false;
              buscarProdutoOnline();
            }, 800);
          };

          await leitorCamera.start(cameraPreferida.id, configuracao, aoLerCodigo, () => {});
        } catch (erro) {
          console.error(erro);

          try {
            if (leitorCamera?.isScanning) {
              await leitorCamera.stop();
            }
          } catch (erroParada) {
            console.warn("Não foi possível parar a câmera após erro:", erroParada);
          }

          try {
            await leitorCamera?.clear();
          } catch (erroLimpeza) {
            console.warn("Não foi possível limpar o leitor após erro:", erroLimpeza);
          }

          cameraAtiva = false;
          leitorCamera = null;
          leituraCameraEmProcessamento = false;
          reader.innerHTML = "";

          alert(
            `Erro ao acessar câmera.\n\n${erro.message || erro}\n\nConfira se você permitiu a câmera no navegador e toque em Escanear Código novamente.`,
          );
        }
      }

      async function buscarProdutoOnline() {
        const codigo = document.getElementById("codigoBarras").value.trim();

        if (!codigo) {
          alert("Digite o código");
          return;
        }

        const produtoJaCadastrado = buscarProdutoJaCarregado(codigo);

        if (produtoJaCadastrado) {
          preencherProdutoEncontrado(produtoJaCadastrado);
          await adicionarProduto(produtoJaCadastrado.imagem, produtoJaCadastrado.marca);
          return;
        }

        if (bancoProdutos[codigo]) {
          preencherProdutoEncontrado(bancoProdutos[codigo]);
          await adicionarProduto();
          return;
        }

        const produtoEncontrado = await buscarProdutoEmFontes(codigo);

        if (!produtoEncontrado) {
          alert(
            "Produto não encontrado nas bases automáticas.\n\nPreencha os dados manualmente e, depois de salvar, o app lembrará este código.",
          );
          return;
        }

        preencherProdutoEncontrado(produtoEncontrado);

        if (produtoEncontrado.fonte === "Família de código de barras") {
          alert(
            "Não encontrei a descrição exata, mas identifiquei a marca/categoria pela família do código.\n\nConfira e ajuste o nome antes de salvar.",
          );
          return;
        }

        await adicionarProduto(produtoEncontrado.imagem, produtoEncontrado.marca);
      }

      async function adicionarProduto(imagem = "", marca = "") {
        const nome = document.getElementById("nome").value.trim();
        const marcaFinal = marca || document.getElementById("marcaCadastro").value.trim();

        if (!nome) {
          alert("Digite o nome");
          return;
        }

        const codigoBarras = document.getElementById("codigoBarras").value.trim();
        const validadeProduto = document.getElementById("validade").value || null;
        const chaveLoteAtual = chaveLote(codigoBarras, validadeProduto);

        if (!validadeProduto) {
          alert("Informe a validade do lote antes de cadastrar.");
          return;
        }

        const arquivo = document.getElementById("imagemManual").files[0];
        if (arquivo && !validarEspacoParaImagem(arquivo)) {
          return;
        }

        const imagemFinal = arquivo ? await converterImagemBase64(arquivo) : imagem;

        if (cadastroEmAndamento || codigosEmCadastro.has(chaveLoteAtual)) {
          return;
        }

        cadastroEmAndamento = true;
        codigosEmCadastro.add(chaveLoteAtual);

        const produto = {
          codigoBarras,
          nome,
          marca: marcaFinal,
          categoria: document.getElementById("categoriaCadastro").value,
          custo: numero(document.getElementById("custo").value),
          preco: numero(document.getElementById("preco").value),
          estoque: inteiro(document.getElementById("estoque").value),
          validade: validadeProduto,
          imagem: imagemFinal,
        };

        if (produto.codigoBarras) {
          salvarProdutoNoBancoLocal(produto);
        }

        const loteExistenteLocal = produtos.find((item) => mesmoLote(item, produto.codigoBarras, produto.validade));

        if (loteExistenteLocal) {
          const estoqueAtualizado = inteiro(loteExistenteLocal.estoque) + inteiro(produto.estoque);
          const { error: erroAtualizacaoLote } = await supabaseClient
            .from("produtos")
            .update({
              estoque: estoqueAtualizado,
            })
            .eq("id", loteExistenteLocal.id);

          cadastroEmAndamento = false;
          codigosEmCadastro.delete(chaveLoteAtual);

          if (erroAtualizacaoLote) {
            alert("Erro ao somar estoque do lote: " + erroAtualizacaoLote.message);
            return;
          }

          await carregarProdutosSupabase();
          limparCampos();
          alert("Lote já existia. A quantidade foi somada ao estoque desse vencimento.");
          return;
        }

        if (produto.codigoBarras) {
          let consultaLote = supabaseClient
            .from("produtos")
            .select("id, estoque")
            .eq("codigo_barras", produto.codigoBarras)
            .limit(1);

          consultaLote = produto.validade ? consultaLote.eq("validade", produto.validade) : consultaLote.is("validade", null);

          const { data: lotesDuplicados, error: erroConsultaLote } = await consultaLote;

          if (erroConsultaLote) {
            cadastroEmAndamento = false;
            codigosEmCadastro.delete(chaveLoteAtual);
            alert("Erro ao verificar lote existente: " + erroConsultaLote.message);
            return;
          }

          if (lotesDuplicados?.length) {
            const lote = lotesDuplicados[0];
            const estoqueAtualizado = inteiro(lote.estoque) + inteiro(produto.estoque);
            const { error: erroSomaSupabase } = await supabaseClient
              .from("produtos")
              .update({
                estoque: estoqueAtualizado,
              })
              .eq("id", lote.id);

            cadastroEmAndamento = false;
            codigosEmCadastro.delete(chaveLoteAtual);

            if (erroSomaSupabase) {
              alert("Erro ao somar estoque do lote: " + erroSomaSupabase.message);
              return;
            }

            await carregarProdutosSupabase();
            limparCampos();
            alert("Lote já existia. A quantidade foi somada ao estoque desse vencimento.");
            return;
          }
        }

        const { error } = await supabaseClient.from("produtos").insert([
          {
            codigo_barras: produto.codigoBarras,
            nome: produto.nome,
            marca: produto.marca,
            categoria: produto.categoria,
            custo: produto.custo,
            preco: produto.preco,
            estoque: produto.estoque,
            validade: produto.validade,
            imagem: produto.imagem,
          },
        ]);

        cadastroEmAndamento = false;
        codigosEmCadastro.delete(chaveLoteAtual);

        if (error) {
          console.error(error);
          alert("Erro ao salvar produto: " + error.message);
          return;
        }

        await carregarProdutosSupabase();
        limparCampos();
        alert("Produto cadastrado com sucesso!");
      }

      async function removerProduto(id) {
        if (!confirm("Deseja realmente excluir este produto?")) return;

        const { error } = await supabaseClient.from("produtos").delete().eq("id", id);

        if (error) {
          alert("Erro ao excluir: " + error.message);
          return;
        }

        await carregarProdutosSupabase();
        alert("Produto excluído com sucesso!");
      }

      async function atualizarCampo(id, campo, valor) {
        const mapaCampos = {
          codigoBarras: "codigo_barras",
          nome: "nome",
          marca: "marca",
          categoria: "categoria",
          custo: "custo",
          preco: "preco",
          estoque: "estoque",
          validade: "validade",
          imagem: "imagem",
        };

        const colunaSupabase = mapaCampos[campo];
        if (!colunaSupabase) {
          console.error("Campo não mapeado:", campo);
          return;
        }

        let valorFinal = valor;
        if (campo === "custo" || campo === "preco") valorFinal = numero(valor);
        if (campo === "estoque") valorFinal = inteiro(valor);
        if (campo === "validade") valorFinal = valor || null;

        const { error } = await supabaseClient
          .from("produtos")
          .update({ [colunaSupabase]: valorFinal })
          .eq("id", id);

        if (error) {
          alert("Erro ao atualizar: " + error.message);
          await carregarProdutosSupabase();
          return;
        }

        const produto = produtos.find((item) => String(item.id) === String(id));

        if (produto) {
          if (campo === "codigoBarras" && produto.codigoBarras && produto.codigoBarras !== valorFinal) {
            delete bancoProdutos[produto.codigoBarras];
          }

          produto[campo] = valorFinal;

          if (["codigoBarras", "nome", "marca", "categoria"].includes(campo)) {
            salvarProdutoNoBancoLocal(produto);
          }
        }

        atualizarTabela();
      }

      async function trocarImagem(event, id) {
        const arquivo = event.target.files[0];
        if (!arquivo) return;

        if (!validarEspacoParaImagem(arquivo, id)) {
          event.target.value = "";
          return;
        }

        const base64 = await converterImagemBase64(arquivo);
        const { error } = await supabaseClient.from("produtos").update({ imagem: base64 }).eq("id", id);

        if (error) {
          alert("Erro ao atualizar imagem: " + error.message);
          event.target.value = "";
          return;
        }

        const produto = produtos.find((item) => String(item.id) === String(id));
        if (produto) produto.imagem = base64;
        event.target.value = "";
        atualizarTabela();
      }

            (produto.nome || "").toLowerCase().includes(busca) ||
            (produto.marca || "").toLowerCase().includes(busca) ||
            (produto.codigoBarras || "").toString().includes(busca);

          return categoriaOk && validadeOk && buscaOk;
        });

        tabela.innerHTML = produtosFiltrados
          .map((produto) => {
            const dias = diasParaVencer(produto.validade);
            const lucro = calcularLucro(produto.custo, produto.preco);

                </td>
                <td>
                  <input class="tabela-input coluna-produto" value="${escaparHtml(produto.nome)}" onchange="atualizarCampo('${idProduto}','nome',this.value)">
                </td>
                <td>
                  <input class="tabela-input" value="${escaparHtml(produto.marca)}" onchange="atualizarCampo('${idProduto}','marca',this.value)">

                <td>
                  <select class="tabela-select" onchange="atualizarCampo('${idProduto}','categoria',this.value)">
                    ${categorias
                      .map(

                          `<option value="${cat}" ${produto.categoria === cat ? "selected" : ""}>${cat}</option>`,
                      )
                      .join("")}
                  </select>
                </td>
                <td>
                  <input class="tabela-input coluna-custo" type="number" step="0.01" value="${escaparHtml(produto.custo || 0)}" onchange="atualizarCampo('${idProduto}','custo',this.value)">
                </td>

                <td>

                </td>

                  <input class="tabela-input coluna-estoque" type="number" value="${escaparHtml(produto.estoque || 0)}" onchange="atualizarCampo('${idProduto}','estoque',this.value)">
                </td>
                <td>
                  <input class="tabela-input" type="date" value="${escaparHtml(produto.validade || "")}" onchange="atualizarCampo('${idProduto}','validade',this.value)">

                </td>

          })
          .join("");
      }

      async function carregarProdutosSupabase() {
        const { data, error } = await supabaseClient
          .from("produtos")
          .select("*")
          .order("validade", { ascending: true, nullsFirst: false });

        if (error) {
          console.error(error);
          alert("Erro ao carregar produtos: " + error.message);
          return;
        }

        produtos = (data || []).map(normalizarProduto);
        atualizarTabela();
      }

      async function registrar() {
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;

        if (!email || !senha) {
          alert("Preencha e-mail e senha.");
          return;
        }

        const { error } = await supabaseClient.auth.signUp({ email, password: senha });

        if (error) {
          alert(error.message);
          return;
        }

        alert("Conta criada. Verifique seu e-mail.");
      }

      async function login() {
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;

        if (!email || !senha) {
          alert("Preencha e-mail e senha.");
          return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

        if (error) {
          alert(error.message);
          return;
        }

        usuarioAtual = data.user;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("erpContainer").style.display = "block";
        await carregarProdutosSupabase();
      }

      async function restaurarSessao() {
        const { data } = await supabaseClient.auth.getSession();
        if (!data.session) return;

        usuarioAtual = data.session.user;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("erpContainer").style.display = "block";
        await carregarProdutosSupabase();
      }

      atualizarTabela();
      restaurarSessao();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          let atualizandoPagina = false;

          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (atualizandoPagina) return;
            atualizandoPagina = true;
            window.location.reload();
          });

          navigator.serviceWorker
            .register("./service-worker.js")
            .then((registro) => {
              registro.update();

              if (registro.waiting) {
                registro.waiting.postMessage({ type: "SKIP_WAITING" });
              }

              registro.addEventListener("updatefound", () => {
                const novoWorker = registro.installing;

                novoWorker?.addEventListener("statechange", () => {
                  if (novoWorker.state === "installed" && navigator.serviceWorker.controller) {
                    novoWorker.postMessage({ type: "SKIP_WAITING" });
                  }
                });
              });
            })
            .catch((err) => {
              console.error("Erro PWA", err);
            });
        });
      }
    </script>
  </body>
</html>
